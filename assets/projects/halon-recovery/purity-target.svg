<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Halon 1301 purification target</title>
  <desc id="desc">Distillation increases Halon 1301 purity from 96 percent to 99.7 percent.</desc>
  <rect width="1200" height="800" fill="#eeebe4"/>
  <g fill="#66635b" font-family="Arial,sans-serif" font-size="22" letter-spacing="5"><text x="100" y="135">HALON 1301</text><text x="100" y="670">SEPARATION SYSTEMS / DISTILLATION</text></g>
  <path d="M100 180h1000M100 620h1000" stroke="#c8c0b4" stroke-width="2"/>
  <g font-family="Georgia,serif" font-size="140"><text x="100" y="430" fill="#292824">96%</text><text x="675" y="430" fill="#773f49">99.7%</text></g>
  <path d="M460 385h150m-28-25 28 25-28 25" fill="none" stroke="#773f49" stroke-width="4"/>
  <g fill="#66635b" font-family="Arial,sans-serif" font-size="24"><text x="105" y="490">Recovered material</text><text x="685" y="490">Purification target</text></g>
</svg>
