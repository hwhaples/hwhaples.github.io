title: Hunter Whaples
description: Projects in engineering, research, and making.
url: https://hwhaples.com
baseurl: ""
lang: en
markdown: kramdown
highlighter: rouge
permalink: pretty
timezone: America/New_York
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge
collections:
  projects:
    output: true
    permalink: /projects/:name/
defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      draft_content: true
      featured_order: 1000
plugins: []
exclude:
  - _archive
  - _templates
  - blog
  - docs
  - scripts
  - tests
  - vendor
  - .bundle
  - .cache
  - .ruby-version
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - '*.sublime-*'
  - demos/README.md
  - demos/cylinder/README.md
